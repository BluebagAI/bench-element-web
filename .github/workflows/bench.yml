# Benchmark copy of element-hq/element-web's build-and-test.yaml as it runs on a pull request:
# the Element Web build and the Chrome tests in upstream's 4 shards, without the tests tagged
# @mergequeue (upstream runs those only in its merge queue). Left out on every runner: the
# Element Desktop jobs (on a pull request upstream builds and smoke-tests the Linux amd64 desktop
# app), the Modules, Firefox, WebKit, Dendrite and Pinecone tests (merge queue, schedule or
# labels only) and the job that merges the reports. Same steps and commit on every runner; only
# the test step differs: Boba runs it with coldteadotai/boba, the others run playwright test
# with a JSON reporter added. Retries, workers (1) and maxFailures come from apps/web's
# playwright.config.ts with CI=true.
#
# Benchmark changes, the same on every runner:
# - checkout takes this repository's commit (upstream names element-hq/element-web).
# - the build pins matrix-js-sdk to one commit (develop as of this copy's upstream commit);
#   upstream builds whatever js-sdk's develop is at the time of the run.
# - the shared test packages are built and the web server is started in their own steps
#   (upstream's test command does both), so Boba starts the tests with the server running.
# - no concurrency group: upstream's would cancel a run when the next one is dispatched.
name: bench
on:
    workflow_dispatch:
        inputs:
            runner:
                description: Where every job runs (github-4 and blacksmith-4 are 4 vCPU, as upstream's runners).
                type: choice
                options: [boba-turbo, boba-standard, github-4, blacksmith-4]
            shards:
                description: 4 is upstream's own layout. 1 runs the whole suite in one job.
                type: choice
                options: ["4", "1"]
                default: "4"

permissions:
    contents: read
    checks: write
    pull-requests: write
    actions: read

env:
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes

jobs:
    build:
        name: Build Element Web (${{ inputs.runner }})
        runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-4' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
              with:
                  cache: true
                  # PR & merge queue caches are scoped to their own ref so nothing else can restore them
                  save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
                  install: false

            - name: Fetch layered build
              id: layered
              env:
                  # tell layered.sh to check out the right sha of the JS-SDK & EW, if they were given one
                  JS_SDK_GITHUB_BASE_REF: 484d22d92269693332fa4413df3ad43ba83097ea
              run: |
                  ./scripts/layered.sh
                  VERSION=$(scripts/get-version-from-git.sh)
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT

            - name: Copy config
              working-directory: apps/web
              run: cp element.io/develop/config.json config.json

            - name: Build
              env:
                  CI_PACKAGE: true
                  VERSION: ${{ steps.layered.outputs.version }}
              working-directory: apps/web
              run: pnpm run build

            - name: Upload Artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: webapp
                  path: apps/web/webapp
                  retention-days: 1

    playwright_ew:
        name: Run Tests [Chrome] ${{ matrix.shard }}/${{ inputs.shards }} (${{ inputs.runner }})
        needs: build
        runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-4' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[1, 2, 3, 4]') }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: 📥 Download artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: webapp
                  path: apps/web/webapp

            - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
              with:
                  cache: true
                  # PR & merge queue caches are scoped to their own ref so nothing else can restore them
                  save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
                  install: true
                  require-lockfile: true

            - name: Setup playwright
              uses: ./.github/actions/setup-playwright
              with:
                  needs-webkit: false
                  write-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

            # Upstream's `pnpm test:playwright` runs nx, which builds these first (^build:playwright).
            - name: Build the shared test packages
              run: pnpm exec nx run-many -t build:playwright

            # Upstream's Playwright starts this server itself (webServer in playwright.config.ts,
            # reuseExistingServer: true).
            - name: Start the web server
              working-directory: apps/web
              run: |
                  pnpm exec serve -p 8080 -L -u ./webapp > serve.log 2>&1 &
                  for i in $(seq 60); do curl -sf -o /dev/null http://localhost:8080/config.json && break; sleep 1; done
                  curl -sf -o /dev/null http://localhost:8080/config.json

            - name: Run Playwright tests on Boba
              if: startsWith(inputs.runner, 'boba')
              uses: coldteadotai/boba@v1
              with:
                  working-directory: apps/web
                  project: Chrome
                  playwright-args: --shard=${{ matrix.shard }}/${{ inputs.shards }} --grep-invert=@mergequeue
                  turbo: ${{ inputs.runner == 'boba-turbo' }}
                  fail-fast: false

            # We skip tests tagged with @mergequeue when running on PRs, but run them in MQ and everywhere else
            - name: Run Playwright tests
              if: ${{ !startsWith(inputs.runner, 'boba') }}
              working-directory: apps/web
              run: |
                  pnpm exec playwright test \
                      --shard=${{ matrix.shard }}/${{ inputs.shards }} \
                      --project=Chrome \
                      --grep-invert=@mergequeue \
                      --reporter=list,json
              env:
                  PLAYWRIGHT_JSON_OUTPUT_FILE: results.json

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: ${{ always() && !startsWith(inputs.runner, 'boba') }}
              with:
                  name: results-${{ inputs.runner }}-${{ matrix.shard }}
                  path: apps/web/results.json
                  retention-days: 30
